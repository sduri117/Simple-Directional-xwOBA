[project]
name = "simple-directional-xwoba"
version = "0.1.0"
description = "Explore Simple Directional expected weighted on-base average."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pytest",
    "ruff",
    "scikit-learn-stubs>=0.0.3",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
files = ["Stage_1-Preprocessing", "Stage_2-xwOBA-local", "tests"]
mypy_path = ["Stage_1-Preprocessing", "Stage_2-xwOBA-local"]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["Stage_1-Preprocessing", "Stage_2-xwOBA-local"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "data_download",
    "data_preprocessing",
    "calculate_batted_ball_xwoba",
    "calculate_season_xwoba",
    "experiment_config",
    "model_evaluation",
    "train_final_model",
]

